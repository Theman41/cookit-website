<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CookIt - Smart Cooking Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="font-['Poppins'] bg-gradient-to-br from-emerald-50 to-green-100 overflow-x-hidden">
    <!-- Main Content -->
    <main class="relative min-h-screen">
        <!-- Hero Section -->
        <section class="flex flex-col items-center justify-center min-h-screen px-4 relative overflow-hidden">
            <!-- Interactive Food Icons -->
            <div class="food-icons">
                <span class="food-icon">🥑</span>
                <span class="food-icon">🍅</span>
                <span class="food-icon">🥕</span>
                <span class="food-icon">🥬</span>
                <span class="food-icon">🧄</span>
                <span class="food-icon">🥦</span>
            </div>

            <!-- Main Title -->
            <div class="text-center z-10 mb-16">
                <h1 class="app-title text-8xl font-bold mb-6">CookIt</h1>
                <p class="text-2xl text-emerald-700 mb-12">Your AI Cooking Companion</p>
                
                <!-- Interactive Demo Button -->
                <button class="try-demo-btn">
                    Try Interactive Demo
                </button>
            </div>

            <!-- Interactive Demo Section -->
            <div id="demo-container" class="hidden max-w-lg w-full bg-white rounded-2xl shadow-xl p-6">
                <div class="demo-header flex justify-between items-center mb-6">
                    <h3 class="text-xl font-semibold text-emerald-700">Ingredient Scanner</h3>
                    <button class="close-demo">×</button>
                </div>
                
                <div class="demo-screen bg-gray-100 rounded-xl p-4 mb-6 relative min-h-[300px]">
                    <div class="scan-area"></div>
                    <div id="ingredients-list" class="space-y-2"></div>
                </div>

                <div class="demo-controls flex gap-4">
                    <button class="scan-btn">Start Scan</button>
                    <button class="generate-btn hidden">Generate Recipe</button>
                </div>
            </div>
        </section>

        <!-- Features Grid -->
        <section class="py-20 px-4 bg-white/50 backdrop-blur-sm">
            <div class="max-w-6xl mx-auto">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <div class="feature-card">
                        <div class="text-4xl mb-4">🔍</div>
                        <h3 class="text-xl font-bold mb-2">Smart Scanner</h3>
                        <p>Instantly identify ingredients with AI</p>
                    </div>
                    <div class="feature-card">
                        <div class="text-4xl mb-4">✨</div>
                        <h3 class="text-xl font-bold mb-2">Recipe Magic</h3>
                        <p>Get personalized recipe suggestions</p>
                    </div>
                    <div class="feature-card">
                        <div class="text-4xl mb-4">📱</div>
                        <h3 class="text-xl font-bold mb-2">AR Guide</h3>
                        <p>Follow recipes in augmented reality</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <style>
        /* Smooth Gradients */
        .app-title {
            background: linear-gradient(45deg, #059669, #10B981);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 10px 20px rgba(16, 185, 129, 0.2);
        }

        /* Floating Food Icons */
        .food-icons {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .food-icon {
            position: absolute;
            font-size: 2rem;
            opacity: 0.5;
            transition: all 0.3s ease;
        }

        /* Feature Cards */
        .feature-card {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .feature-card:hover {
            transform: translateY(-5px);
            border-color: #10B981;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.1);
        }

        /* Interactive Demo Button */
        .try-demo-btn {
            background: linear-gradient(45deg, #059669, #10B981);
            color: white;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .try-demo-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2);
        }

        /* Demo Container */
        #demo-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            transition: all 0.3s ease;
        }

        .scan-area {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: #10B981;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .scanning .scan-area {
            opacity: 1;
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% { transform: translateY(0); }
            100% { transform: translateY(300px); }
        }

        .scan-btn, .generate-btn {
            background: #10B981;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .scan-btn:hover, .generate-btn:hover {
            background: #059669;
        }

        .close-demo {
            font-size: 24px;
            color: #666;
            transition: all 0.3s ease;
        }

        .close-demo:hover {
            color: #000;
        }

        .ingredient-marker {
            background: rgba(16, 185, 129, 0.1);
            border: 2px solid #10B981;
            border-radius: 8px;
            padding: 0.5rem;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>

    <script>
        // Food Icons Animation
        function setupFoodIcons() {
            const icons = document.querySelectorAll('.food-icon');
            icons.forEach((icon, index) => {
                const angle = (index / icons.length) * Math.PI * 2;
                const radius = 150;
                const x = Math.cos(angle) * radius;
                const y = Math.sin(angle) * radius;
                
                icon.style.left = `calc(50% + ${x}px)`;
                icon.style.top = `calc(50% + ${y}px)`;
                
                setInterval(() => {
                    icon.style.transform = `translate(${Math.random() * 20 - 10}px, ${Math.random() * 20 - 10}px)`;
                }, 2000);
            });
        }

        // Interactive Demo
        document.addEventListener('DOMContentLoaded', () => {
            setupFoodIcons();

            const demoBtn = document.querySelector('.try-demo-btn');
            const demoContainer = document.getElementById('demo-container');
            const closeDemo = document.querySelector('.close-demo');
            const scanBtn = document.querySelector('.scan-btn');
            const generateBtn = document.querySelector('.generate-btn');
            const demoScreen = document.querySelector('.demo-screen');
            const ingredientsList = document.getElementById('ingredients-list');

            const ingredients = [
                { name: 'Tomatoes', confidence: '98%' },
                { name: 'Onions', confidence: '96%' },
                { name: 'Bell Peppers', confidence: '95%' },
                { name: 'Garlic', confidence: '97%' }
            ];

            demoBtn.addEventListener('click', () => {
                demoContainer.classList.remove('hidden');
            });

            closeDemo.addEventListener('click', () => {
                demoContainer.classList.add('hidden');
                resetDemo();
            });

            scanBtn.addEventListener('click', () => {
                demoScreen.classList.add('scanning');
                scanBtn.disabled = true;
                
                setTimeout(() => {
                    demoScreen.classList.remove('scanning');
                    showIngredients();
                }, 2000);
            });

            function showIngredients() {
                ingredientsList.innerHTML = '';
                ingredients.forEach((ingredient, index) => {
                    setTimeout(() => {
                        const marker = document.createElement('div');
                        marker.className = 'ingredient-marker';
                        marker.innerHTML = `
                            <span>${ingredient.name}</span>
                            <span class="text-emerald-600">${ingredient.confidence}</span>
                        `;
                        ingredientsList.appendChild(marker);

                        if (index === ingredients.length - 1) {
                            generateBtn.classList.remove('hidden');
                        }
                    }, index * 500);
                });
            }

            function resetDemo() {
                demoScreen.classList.remove('scanning');
                ingredientsList.innerHTML = '';
                generateBtn.classList.add('hidden');
                scanBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
