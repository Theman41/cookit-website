<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CookIt - Magical Cooking Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body class="font-['Fredoka'] bg-gradient-to-br from-emerald-50 to-green-100 overflow-x-hidden">
    <!-- Animated Background Bubbles -->
    <div class="bubbles">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <!-- Cartoon Chef Hat Logo -->
    <div class="cartoon-chef-hat">
        <div class="hat-body">
            <div class="hat-top"></div>
            <div class="hat-middle"></div>
            <div class="hat-base"></div>
            <div class="hat-shadow"></div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="relative min-h-screen">
        <!-- Hero Section -->
        <section class="flex flex-col items-center justify-center min-h-screen px-4 py-20">
            <div class="text-center z-10">
                <div class="cartoon-chef-hat mx-auto mb-8"></div>
                <h1 class="magical-title text-6xl md:text-8xl font-bold mb-6">CookIt</h1>
                <p class="text-xl md:text-2xl text-emerald-700 mb-12 max-w-2xl mx-auto animate-float">
                    Your AI Cooking Companion
                </p>
                <div class="flex flex-wrap justify-center gap-6">
                    <button class="fun-button">
                        Start Cooking
                        <span class="sparkles"></span>
                    </button>
                    <button class="fun-button-secondary">
                        Watch Magic
                        <span class="sparkles"></span>
                    </button>
                </div>
            </div>
        </section>

        <!-- Features Section -->
        <section class="py-20 px-4">
            <div class="max-w-6xl mx-auto">
                <h2 class="magical-title text-4xl font-bold text-center mb-16">Magical Features</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <div class="fun-card">
                        <div class="fun-card-inner">
                            <div class="fun-icon">🔍</div>
                            <h3>Smart Scanner</h3>
                            <p>Point & recognize ingredients instantly!</p>
                        </div>
                    </div>
                    <div class="fun-card">
                        <div class="fun-card-inner">
                            <div class="fun-icon">✨</div>
                            <h3>Recipe Magic</h3>
                            <p>Transform ingredients into delicious meals!</p>
                        </div>
                    </div>
                    <div class="fun-card">
                        <div class="fun-card-inner">
                            <div class="fun-icon">🎮</div>
                            <h3>AR Kitchen</h3>
                            <p>Cook with augmented reality guidance!</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Join Section -->
        <section class="py-20 px-4">
            <div class="max-w-4xl mx-auto">
                <div class="fun-form-container">
                    <h2 class="magical-title text-4xl font-bold mb-8">Join the Fun!</h2>
                    <form class="space-y-6">
                        <div class="fun-input-group">
                            <input type="email" placeholder="Your email" class="fun-input">
                            <button type="submit" class="fun-submit">
                                Let's Cook!
                                <span class="sparkles"></span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <style>
        /* Animated Background */
        .bubbles {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, transparent, rgba(16, 185, 129, 0.1));
        }

        .bubble {
            position: absolute;
            bottom: -100px;
            width: 40px;
            height: 40px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 50%;
            animation: float-up 15s infinite;
            opacity: 0;
        }

        .bubble:nth-child(1) { left: 10%; animation-delay: 0s; }
        .bubble:nth-child(2) { left: 30%; animation-delay: 2s; }
        .bubble:nth-child(3) { left: 50%; animation-delay: 4s; }
        .bubble:nth-child(4) { left: 70%; animation-delay: 6s; }
        .bubble:nth-child(5) { left: 90%; animation-delay: 8s; }
        .bubble:nth-child(6) { left: 20%; animation-delay: 10s; }

        @keyframes float-up {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0;
            }
            50% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(-100vh) scale(2);
                opacity: 0;
            }
        }

        /* Cartoon Chef Hat */
        .cartoon-chef-hat {
            width: 200px;
            height: 200px;
            position: relative;
            animation: bounce 3s ease-in-out infinite;
        }

        .hat-body {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .hat-top {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 100px;
            background: white;
            border-radius: 100px 100px 20px 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        .hat-middle {
            position: absolute;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 20px;
            background: white;
            border-radius: 20px;
        }

        .hat-base {
            position: absolute;
            top: 140px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 30px;
            background: white;
            border-radius: 10px;
        }

        .hat-shadow {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 10px;
            background: rgba(0,0,0,0.1);
            border-radius: 50%;
            filter: blur(5px);
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        /* Magical Title */
        .magical-title {
            background: linear-gradient(45deg, #059669, #10B981, #34D399);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            position: relative;
        }

        .magical-title::after {
            content: '';
            position: absolute;
            inset: -10px;
            background: radial-gradient(circle at center, rgba(16, 185, 129, 0.2), transparent 70%);
            filter: blur(10px);
            z-index: -1;
        }

        /* Fun Buttons */
        .fun-button, .fun-button-secondary {
            padding: 1rem 2rem;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1rem;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            z-index: 1;
        }

        .fun-button {
            background: linear-gradient(45deg, #059669, #10B981);
            color: white;
        }

        .fun-button-secondary {
            background: white;
            color: #059669;
        }

        .fun-button:hover, .fun-button-secondary:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2);
        }

        .sparkles {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: translateX(-100%);
            animation: sparkle 2s linear infinite;
        }

        @keyframes sparkle {
            100% { transform: translateX(100%); }
        }

        /* Fun Cards */
        .fun-card {
            background: rgba(255,255,255,0.7);
            border-radius: 24px;
            padding: 2rem;
            position: relative;
            overflow: hidden;
            transition: all 0.5s ease;
        }

        .fun-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(45deg, transparent, rgba(16, 185, 129, 0.1), transparent);
            transform: translateX(-100%);
            animation: card-shine 3s infinite;
        }

        @keyframes card-shine {
            100% { transform: translateX(100%); }
        }

        .fun-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px rgba(16, 185, 129, 0.2);
        }

        .fun-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        /* Fun Form */
        .fun-form-container {
            background: rgba(255,255,255,0.8);
            border-radius: 30px;
            padding: 3rem;
            box-shadow: 0 20px 40px rgba(16, 185, 129, 0.1);
        }

        .fun-input {
            width: 100%;
            padding: 1rem 2rem;
            border-radius: 50px;
            border: 2px solid rgba(16, 185, 129, 0.2);
            background: white;
            transition: all 0.3s ease;
        }

        .fun-input:focus {
            border-color: #10B981;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
            outline: none;
        }

        .fun-submit {
            background: linear-gradient(45deg, #059669, #10B981);
            color: white;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .fun-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2);
        }
    </style>

    <script>
        // Animate elements on scroll
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.fun-card').forEach(card => {
            card.style.opacity = '0';
            card.style.transform = 'translateY(50px)';
            observer.observe(card);
        });

        // Add floating bubbles dynamically
        function createBubble() {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            document.querySelector('.bubbles').appendChild(bubble);
            
            bubble.addEventListener('animationend', () => {
                bubble.remove();
            });
        }

        setInterval(createBubble, 3000);
    </script>
</body>
</html>
