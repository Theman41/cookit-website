<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CookIt - Your Magical Cooking Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Add GSAP for smooth animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body class="font-['Quicksand'] bg-gradient-to-br from-emerald-50 to-green-100 overflow-x-hidden">
    <!-- Animated Background -->
    <div class="animated-bg"></div>

    <!-- Floating Elements -->
    <div class="floating-elements">
        <div class="floating-icon" style="--delay: 0s">🥕</div>
        <div class="floating-icon" style="--delay: 2s">🍅</div>
        <div class="floating-icon" style="--delay: 4s">🥬</div>
        <div class="floating-icon" style="--delay: 1s">🧄</div>
        <div class="floating-icon" style="--delay: 3s">🥦</div>
    </div>

    <!-- Splash Screen with Loading Animation -->
    <div id="splash-screen" class="fixed inset-0 bg-gradient-to-br from-emerald-400 to-green-500 flex items-center justify-center z-50">
        <div class="text-center">
            <img src="logo.png" alt="CookIt Logo" class="splash-logo mx-auto mb-6">
            <div class="loading-bar">
                <div class="loading-progress"></div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="relative">
        <!-- Hero Section -->
        <section class="min-h-screen flex items-center justify-center px-4 py-20">
            <div class="max-w-6xl mx-auto text-center relative z-10">
                <div class="hero-content">
                    <img src="logo.png" alt="CookIt Logo" class="main-logo mx-auto mb-6 glow-effect">
                    <h1 class="text-5xl md:text-7xl font-bold text-emerald-600 mb-6 magical-text">
                        CookIt
                    </h1>
                    <p class="text-xl md:text-2xl text-emerald-700 mb-12 max-w-2xl mx-auto fade-in-up">
                        Your AI Cooking Companion
                    </p>
                    <div class="flex flex-wrap justify-center gap-4">
                        <button class="magical-button">
                            Get Started
                            <span class="magical-button-bg"></span>
                        </button>
                        <button class="magical-button-secondary">
                            Watch Demo
                            <span class="magical-button-bg"></span>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Features Section -->
        <section class="py-20 px-4">
            <div class="max-w-6xl mx-auto">
                <h2 class="text-4xl font-bold text-center mb-16 magical-text">Magical Features</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <div class="magical-card" data-speed="1.1">
                        <div class="magical-card-content">
                            <div class="feature-icon">🎯</div>
                            <h3>Smart Recognition</h3>
                            <p>Point, scan, and discover ingredients instantly</p>
                        </div>
                    </div>
                    <div class="magical-card" data-speed="1.2">
                        <div class="magical-card-content">
                            <div class="feature-icon">✨</div>
                            <h3>Recipe Magic</h3>
                            <p>Transform ingredients into delicious recipes</p>
                        </div>
                    </div>
                    <div class="magical-card" data-speed="1.3">
                        <div class="magical-card-content">
                            <div class="feature-icon">🌟</div>
                            <h3>AR Guide</h3>
                            <p>Follow cooking steps with AR guidance</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Interactive Demo Section -->
        <section class="py-20 px-4 bg-white/30 backdrop-blur-lg">
            <div class="max-w-6xl mx-auto">
                <div class="interactive-demo">
                    <div class="demo-phone">
                        <div class="demo-screen">
                            <div class="scan-animation"></div>
                            <div class="ingredient-markers"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Join Waitlist -->
        <section class="py-20 px-4">
            <div class="max-w-4xl mx-auto text-center">
                <div class="magical-form-container">
                    <h2 class="text-4xl font-bold mb-8 magical-text">Join the Magic</h2>
                    <form class="magical-form">
                        <div class="form-group">
                            <input type="email" placeholder="Enter your email" class="magical-input">
                            <button type="submit" class="magical-submit">
                                Join Waitlist
                                <span class="magical-submit-bg"></span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <style>
        /* Animated Background */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, 
                rgba(4, 120, 87, 0.1),
                rgba(16, 185, 129, 0.1),
                rgba(52, 211, 153, 0.1));
            filter: blur(100px);
            z-index: -1;
            animation: gradientMove 20s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Elements */
        .floating-elements {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .floating-icon {
            position: absolute;
            font-size: 2rem;
            animation: float 6s ease-in-out infinite;
            animation-delay: var(--delay);
            opacity: 0.5;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(10px, -10px); }
            50% { transform: translate(-5px, 5px); }
            75% { transform: translate(5px, -5px); }
        }

        /* Magical Text Effect */
        .magical-text {
            background: linear-gradient(45deg, #059669, #10B981, #34D399);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: textGradient 8s ease infinite;
        }

        @keyframes textGradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Glowing Logo Effect */
        .glow-effect {
            filter: drop-shadow(0 0 15px rgba(16, 185, 129, 0.5));
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 15px rgba(16, 185, 129, 0.5)); }
            to { filter: drop-shadow(0 0 25px rgba(16, 185, 129, 0.8)); }
        }

        /* Magical Cards */
        .magical-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 2rem;
            transition: all 0.5s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        .magical-card:hover {
            transform: translateY(-10px) rotateX(10deg) rotateY(10deg);
            border-color: rgba(16, 185, 129, 0.5);
            box-shadow: 
                0 15px 35px rgba(16, 185, 129, 0.2),
                0 0 15px rgba(16, 185, 129, 0.3);
        }

        /* Magical Buttons */
        .magical-button {
            position: relative;
            padding: 1rem 2rem;
            background: linear-gradient(45deg, #059669, #10B981);
            border-radius: 50px;
            color: white;
            font-weight: bold;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .magical-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }

        .magical-button::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(45deg);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        /* Interactive Demo */
        .demo-phone {
            width: 300px;
            height: 600px;
            background: #fff;
            border-radius: 40px;
            padding: 20px;
            margin: 0 auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        .demo-screen {
            width: 100%;
            height: 100%;
            background: #000;
            border-radius: 30px;
            overflow: hidden;
            position: relative;
        }

        .scan-animation {
            position: absolute;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #10B981, transparent);
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% { transform: translateY(0); }
            100% { transform: translateY(100%); }
        }

        /* Loading Animation */
        .loading-bar {
            width: 200px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        .loading-progress {
            width: 100%;
            height: 100%;
            background: white;
            animation: loading 2s ease-in-out infinite;
            transform-origin: left;
        }

        @keyframes loading {
            0% { transform: scaleX(0); }
            50% { transform: scaleX(1); }
            100% { transform: scaleX(0); transform-origin: right; }
        }

        /* Magical Form */
        .magical-form-container {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 3rem;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .magical-input {
            width: 100%;
            padding: 1rem 2rem;
            border-radius: 50px;
            border: 2px solid rgba(16, 185, 129, 0.3);
            background: rgba(255,255,255,0.9);
            transition: all 0.3s ease;
        }

        .magical-input:focus {
            border-color: #10B981;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
            outline: none;
        }
    </style>

    <script>
        // Initialize GSAP
        gsap.registerPlugin(ScrollTrigger);

        // Splash Screen Animation
        window.addEventListener('load', () => {
            setTimeout(() => {
                gsap.to('#splash-screen', {
                    opacity: 0,
                    duration: 0.5,
                    onComplete: () => {
                        document.getElementById('splash-screen').style.display = 'none';
                    }
                });
            }, 2000);
        });

        // Animate elements on scroll
        gsap.utils.toArray('.magical-card').forEach(card => {
            gsap.from(card, {
                scrollTrigger: {
                    trigger: card,
                    start: 'top bottom-=100',
                    end: 'top center',
                    scrub: true
                },
                y: 100,
                opacity: 0,
                duration: 1
            });
        });

        // Parallax effect for cards
        document.addEventListener('mousemove', (e) => {
            const cards = document.querySelectorAll('.magical-card');
            const mouseX = e.clientX / window.innerWidth - 0.5;
            const mouseY = e.clientY / window.innerHeight - 0.5;

            cards.forEach(card => {
                const speed = card.getAttribute('data-speed');
                const x = mouseX * 50 * speed;
                const y = mouseY * 50 * speed;
                card.style.transform = `translateX(${x}px) translateY(${y}px) rotateX(${-y * 20}deg) rotateY(${x * 20}deg)`;
            });
        });

        // Floating elements positioning
        const floatingIcons = document.querySelectorAll('.floating-icon');
        floatingIcons.forEach(icon => {
            icon.style.left = `${Math.random() * 100}%`;
            icon.style.top = `${Math.random() * 100}%`;
        });
    </script>
</body>
</html>
